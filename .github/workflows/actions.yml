name: Build and Publish

on:
  push:
    branches: [ceen, main]
  pull_request:
    branches: [ceen, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-marketplace-identity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Resolve Azure DevOps Marketplace profile ID
        run: |
          az rest \
            --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource '499b84ac-1321-427f-aa17-267ca6975798' \
            --query '{id:id,displayName:displayName,publicAlias:publicAlias}' \
            --output json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate extension identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          if (`${manifest.publisher}.${manifest.name}` !== 'yeceen.har-analyzer') {
            throw new Error('Expected extension ID yeceen.har-analyzer');
          }
          if (process.env.GITHUB_EVENT_NAME === 'release' && process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error(`Release tag must be v${manifest.version}`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: har-analyzer-vsix
          path: har-analyzer.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'ceendev/har-analyzer' && github.event_name == 'release' && github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: har-analyzer-vsix
      - name: Check publishing credentials
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See PUBLISHING.md."
            exit 1
          fi
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish using Microsoft Entra ID
        run: npx --no-install vsce publish --packagePath har-analyzer.vsix --azure-credential
