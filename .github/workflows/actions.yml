name: Build and Publish

on:
  push:
    branches: [ceen, main]
    tags: ['v*']
  pull_request:
    branches: [ceen, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-out version to Marketplace
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to validate (for example, v0.0.17)
        required: true
        default: v0.0.17
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate extension identity and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node <<'NODE'
          const manifest = require('./package.json');
          if (`${manifest.publisher}.${manifest.name}` !== 'yeceen.har-auto-analyzer') {
            throw new Error('Expected extension ID yeceen.har-auto-analyzer');
          }
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== `v${manifest.version}`) {
            throw new Error(`Release tag must be v${manifest.version}`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: har-auto-analyzer-vsix
          path: har-auto-analyzer.vsix
          if-no-files-found: error

  publish:
    if: github.repository == 'ceendev/har-auto-analyzer' && ((github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: har-auto-analyzer-vsix
      - name: Check publishing credentials
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in the marketplace environment. See PUBLISHING.md."
            exit 1
          fi
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish using Microsoft Entra ID
        id: publish
        continue-on-error: true
        run: npx --no-install vsce publish --packagePath har-auto-analyzer.vsix --azure-credential
      - name: Update an existing hidden Marketplace entry
        if: steps.publish.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const manifest = require('./package.json');
          const { getAzureCredentialAccessToken } = require('./node_modules/@vscode/vsce/out/auth');
          const { getGalleryAPI } = require('./node_modules/@vscode/vsce/out/util');

          (async () => {
            const token = await getAzureCredentialAccessToken();
            const api = await getGalleryAPI(token);
            let extension;
            try {
              extension = await api.updateExtensionProperties(
                'yeceen',
                'har-auto-analyzer',
                256 // PublishedExtensionFlags.Public
              );
            } catch (error) {
              const errorMessage = String(error?.message || error);
              const isUnchangedResponse = errorMessage.includes(
                "Cannot read properties of null (reading 'flags')"
              );
              if (!isUnchangedResponse) {
                throw error;
              }
              console.log('Marketplace visibility is already public.');
            }
            const query = {
              filters: [{
                pageNumber: 1,
                pageSize: 10,
                criteria: [
                  { filterType: 7, value: 'yeceen.har-auto-analyzer' },
                  { filterType: 13, value: String(256 | 4096 | 32768) }
                ]
              }],
              flags: 1 | 16 | 32768
            };
            const queryResult = await api.queryExtensions(undefined, query);
            const queriedExtension = queryResult?.results
              ?.flatMap(result => result.extensions || [])
              .find(item => item.extensionName === 'har-auto-analyzer');
            if (queriedExtension) {
              extension = queriedExtension;
            }
            const versionExists = extension?.versions?.some(
              version => version.version === manifest.version
            );
            if (!versionExists) {
              await api.updateExtension(
                undefined,
                fs.createReadStream('har-auto-analyzer.vsix'),
                'yeceen',
                'har-auto-analyzer'
              );
              extension = await api.updateExtensionProperties(
                'yeceen',
                'har-auto-analyzer',
                256 // PublishedExtensionFlags.Public
              );
            } else {
              console.log(`Marketplace entry already contains v${manifest.version}.`);
            }
            console.log(`Marketplace flags after restore: ${extension.flags}.`);
            console.log(`Latest version flags: ${extension.versions?.[0]?.flags ?? 'unknown'}.`);
            console.log('Updated existing Marketplace entry yeceen.har-auto-analyzer.');
          })().catch(error => {
            console.error(error?.message || error);
            process.exitCode = 1;
          });
          NODE
